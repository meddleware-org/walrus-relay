name: Integration (localnet)

# Opt-in localnet e2e for the relay library — probes the real upload-relay and drives the access-gate
# ownership check against the localnet access_gate. Kept off the PR path. The localnet substrate lives
# in the walrus-client repo (single source of truth), cloned here at a pinned ref.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # nightly, staggered after walrus-client

permissions:
  contents: read

jobs:
  localnet:
    name: walrus-relay localnet suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout walrus-relay (into repos/walrus-relay)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/walrus-relay

      - name: Checkout walrus-client (provides localnet/ harness)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meddleware-org/walrus-client
          ref: ${{ vars.WALRUS_CLIENT_REF || 'main' }}
          path: repos/walrus-client

      - name: Checkout access-gate-sui (sibling, for the localnet gate deploy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meddleware-org/access-gate-sui
          ref: ${{ vars.ACCESS_GATE_REF || 'main' }}
          path: repos/access-gate-sui

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install sui CLI (suiup)
        run: |
          curl -fsSLo /tmp/suiup.tgz "https://github.com/MystenLabs/suiup/releases/download/v0.0.14/suiup-Linux-musl-x86_64.tar.gz"
          echo "c0b9fea95d52c4c5855478c3ee56e58e446614f32300dbd41fcc637a2e09878a  /tmp/suiup.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/suiup.tgz -C "$HOME/.local/bin" suiup
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/suiup" install sui@testnet-v1.81.0 --yes
          # The release asset suiup downloads is not checksum-verified by suiup itself: pin the binary (the
          # same one the Move packages' CI pins, and the toolchain their Published.toml names).
          echo "c86c0481a44174dfa17af89e71292d6fba5df267c66722ae6797e8793a22f7f1  $HOME/.local/bin/sui" | sha256sum -c -
          # Initialise the default client config now (first-run prompts for keypair creation).
          # Cannot register the localnet env yet — the node starts in the next step.
          "$HOME/.local/bin/sui" client envs || true

      - name: Bring up + bootstrap the localnet testbed
        working-directory: repos/walrus-client/localnet
        run: |
          bash scripts/up.sh
          # The Sui localnet node is now reachable. Register and activate the env.
          "$HOME/.local/bin/sui" client new-env --alias localnet --rpc http://127.0.0.1:9000
          "$HOME/.local/bin/sui" client switch --env localnet
          bash scripts/bootstrap-localnet.sh

      - name: Install deps
        working-directory: repos/walrus-relay
        run: npm install

      - name: Run localnet integration suite
        working-directory: repos/walrus-relay
        run: |
          set -a && source ../walrus-client/localnet/.env.localnet && set +a
          npm run test:integration

      - name: Tear down
        if: always()
        working-directory: repos/walrus-client/localnet
        run: bash scripts/down.sh || true
