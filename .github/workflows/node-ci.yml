name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: node .github/audit-gate.mjs

      - name: Type-check
        run: npm run type-check

      - name: Lint CSS (stylelint)
        run: npm run lint:css --if-present

      - name: Lint JS (eslint + vuejs-a11y)
        run: npm run lint:js --if-present

      - name: Lint HTML (html-validate)
        run: npm run lint:html --if-present

      - name: Test
        run: npm test
